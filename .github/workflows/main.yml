name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Verify launcher resources
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD
          echo "=== LAUNCHER FILES ==="
          find app/src/main/res -type f | grep ic_launcher
          echo "=== FILE TYPES ==="
          file app/src/main/res/mipmap-hdpi/ic_launcher.png
          file app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          echo "=== MANIFEST ==="
          grep -n "android:icon\|android:roundIcon" app/src/main/AndroidManifest.xml
          echo "=== GIT TREE ==="
          git ls-tree -r --name-only HEAD | grep ic_launcher
          echo "=== GIT ICON CHECK ==="
          git show HEAD:app/src/main/res/mipmap-hdpi/ic_launcher.png >/dev/null
          echo "PNG TRACKED IN COMMIT"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: child-app-debug
          path: app/build/outputs/apk/debug/*.apk
